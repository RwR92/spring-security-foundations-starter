server {
    listen 80;
    server_name localhost;

    root /usr/share/nginx/html;
    index index.html;

    # Real files must exist - a missing asset gives a 404, not index.html
    location ~* \.(?:js|css)$ {
        add_header Cache-Control "no-cache";
        try_files $uri =404;
    }

    # Everything else is a route in the SPA, so give the browser index.html
    location / {
        add_header Cache-Control "no-cache";
        try_files $uri /index.html;
    }
}